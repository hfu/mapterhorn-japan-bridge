<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>mapterhorn-japan-bridge プレビュー</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  .panel {
    position: absolute; top: 0; left: 0; max-width: 20rem;
    background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 0 0 12px 0; box-shadow: 0 1px 4px rgba(0,0,0,.2);
    z-index: 10; line-height: 1.45; font-size: 0.88rem; padding: .9rem 1rem;
  }
  .panel h1 { font-size: 1rem; margin: 0 0 .4rem; }
  .panel p { margin: .4rem 0; }
  .panel a { color: inherit; }
  .panel label { display: block; margin-top: .5rem; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>mapterhorn-japan-bridge</h1>
  <p>GSI DEM (1m, falling back to 5m/10m) via
    <a href="https://source.coop/smartmaps/japan-geotiff-dem">japan-geotiff-dem</a>,
    tiled with <a href="https://github.com/hfu/mapterhorn">hfu/mapterhorn</a>.
    Interim bridge until upstream Mapterhorn's own Japan source picks up
    the same update.</p>
  <label><input type="checkbox" id="terrain-toggle"> 3D地形表示</label>
</div>
<script src="app.js"></script>
</body>
</html>
